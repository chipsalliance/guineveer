id:
  library: libdefault
  name: uart_wrapper
  vendor: vendor
  version: '1.0'

clocks:
  uart:
    signal: clk_i

resets:
  uart:
    signal: rst_ni
    polarity: active low

interfaces:
  ahb:
    mode: subordinate
    clock: uart
    reset: uart
    signals:
      in:
        haddr: {bound: ['31', '0'], name: haddr_i}
        hsize: {bound: ['2', '0'], name: hsize_i}
        htrans: {bound: ['1', '0'], name: htrans_i}
        hwdata: {bound: ['63', '0'], name: hwdata_i}
        hwrite: {name: hwrite_i}
      out:
        hrdata: {bound: ['63', '0'], name: hrdata_o}
        hresp: {name: hresp_o}
    type:
      library: libdefault
      name: AHBguin
      vendor: vendor
      version: '1.0'
signals:
  in:
  - {name: clk_i}
  - {name: uart_rx_i}
  - {name: rst_ni}
  out:
  - {name: uart_tx_o}
