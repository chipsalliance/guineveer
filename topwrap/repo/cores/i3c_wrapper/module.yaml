id:
  library: libdefault
  name: i3c_wrapper
  vendor: vendor

clocks:
  i3c:
    signal: clk_i

resets:
  i3c:
    signal: rst_ni
    polarity: active low

interfaces:
  axi:
    mode: subordinate
    clock: i3c
    reset: i3c
    signals:
      in:
        araddr: {bound: [AxiAddrWidth-1, '0'], name: araddr_i}
        arburst: {bound: ['1', '0'], name: arburst_i}
        arid: {bound: [AxiIdWidth-1, '0'], name: arid_i}
        arlen: {bound: ['7', '0'], name: arlen_i}
        arlock: {name: arlock_i}
        arsize: {bound: ['2', '0'], name: arsize_i}
        aruser: {bound: [AxiUserWidth-1, '0'], name: aruser_i}
        arvalid: {name: arvalid_i}
        awaddr: {bound: [AxiAddrWidth-1, '0'], name: awaddr_i}
        awburst: {bound: ['1', '0'], name: awburst_i}
        awid: {bound: [AxiIdWidth-1, '0'], name: awid_i}
        awlen: {bound: ['7', '0'], name: awlen_i}
        awlock: {name: awlock_i}
        awsize: {bound: ['2', '0'], name: awsize_i}
        awuser: {bound: [AxiUserWidth-1, '0'], name: awuser_i}
        awvalid: {name: awvalid_i}
        bready: {name: bready_i}
        rready: {name: rready_i}
        wdata: {bound: [AxiDataWidth-1, '0'], name: wdata_i}
        wlast: {name: wlast_i}
        wstrb: {bound: [AxiDataWidth/8-1, '0'], name: wstrb_i}
        wuser: {bound: [AxiUserWidth-1, '0'], name: wuser_i}
        wvalid: {name: wvalid_i}
      out:
        arready: {name: arready_o}
        awready: {name: awready_o}
        bid: {bound: [AxiIdWidth-1, '0'], name: bid_o}
        bresp: {bound: [1, '0'], name: bresp_o}
        buser: {bound: [AxiUserWidth-1, '0'], name: buser_o}
        bvalid: {name: bvalid_o}
        rdata: {bound: [AxiDataWidth-1, '0'], name: rdata_o}
        rid: {bound: [AxiIdWidth-1, '0'], name: rid_o}
        rlast: {name: rlast_o}
        rresp: {bound: ['1', '0'], name: rresp_o}
        ruser: {bound: [AxiUserWidth-1, '0'], name: ruser_o}
        rvalid: {name: rvalid_o}
        wready: {name: wready_o}
    type:
      library: libdefault
      name: AXI4
      vendor: vendor

parameters:
  AxiAddrWidth: '12'
  AxiDataWidth: '32'
  AxiIdWidth: '8'
  AxiUserWidth: '32'
  CsrAddrWidth: I3CCSR_pkg::I3CCSR_MIN_ADDR_WIDTH
  CsrDataWidth: I3CCSR_pkg::I3CCSR_DATA_WIDTH
  DatAw: i3c_pkg::DatAw
  DctAw: i3c_pkg::DctAw
  NumPrivIds: '4'

signals:
  in:
  - {name: clk_i}
  - {name: rst_ni}

  - {name: disable_id_filtering_i, default: 1}
  - {name: priv_ids_i}

  - {name: scl_i}
  - {name: sda_i}

  - {name: peripheral_reset_done_i}
  out:
  - {name: scl_o}
  - {name: sda_o}
  - {name: scl_oe}
  - {name: sda_oe}

  - {name: sel_od_pp_o}

  - {name: recovery_payload_available_o}
  - {name: recovery_image_activated_o}

  - {name: peripheral_reset_o}
  - {name: escalated_reset_o}

  - {name: irq_o}
