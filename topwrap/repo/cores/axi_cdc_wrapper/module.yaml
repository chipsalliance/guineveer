id:
  library: libdefault
  name: axi_cdc_wrapper
  vendor: vendor

clocks:
  src:
    signal: src_clk_i
  dst:
    signal: dst_clk_i

resets:
  src:
    signal: src_rst_ni
    polarity: active low
  dst:
    signal: dst_rst_ni
    polarity: active low

interfaces:
  m_axi_dst:
    mode: manager
    clock: dst
    reset: dst
    signals:
      in:
        arready: {name: m_axi_dst_arready}
        awready: {name: m_axi_dst_awready}
