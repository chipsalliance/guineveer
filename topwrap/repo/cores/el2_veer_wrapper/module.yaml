signals:
  in:
  - {name: clk}
  - {name: rst_l}
  - {name: dbg_rst_l}
  - {bound: ['31', '1'], name: rst_vec}
  - {name: nmi_int}
  - {bound: ['31', '1'], name: nmi_vec}
  - {bound: ['31', '1'], name: jtag_id}

  - {name: lsu_bus_clk_en, default: 1}
  - {name: ifu_bus_clk_en, default: 1}
  - {name: dbg_bus_clk_en, default: 1}
  - {name: dma_bus_clk_en, default: 1}

  - {name: timer_int}
  - {name: soft_int, default: 0}
  - {bound: [pt.PIC_TOTAL_INT, '1'], name: extintsrc_req}

  - {name: jtag_tck}
  - {name: jtag_tms}
  - {name: jtag_tdi}
  - {name: jtag_trst_n}

  - {bound: ['31', '4'], name: core_id}

  - {name: mpc_debug_halt_req, default: 0}
  - {name: mpc_debug_run_req, default: 0}
  - {name: mpc_reset_run_req, default: 1}

  - {name: i_cpu_halt_req, default: 0}
  - {name: i_cpu_run_req, default: 0}

  - {name: scan_mode, default: 0}
  - {name: mbist_mode, default: 0}

  - {name: dmi_core_enable}
  - {name: dmi_uncore_enable}
  - {bound: ['31', '0'], name: dmi_uncore_rdata}

  out:
  - {bound: ['31', '0'], name: trace_rv_i_insn_ip}
  - {bound: ['31', '0'], name: trace_rv_i_address_ip}
  - {name: trace_rv_i_valid_ip}
  - {name: trace_rv_i_exception_ip}
  - {bound: ['4', '0'], name: trace_rv_i_ecause_ip}
  - {name: trace_rv_i_interrupt_ip}
  - {bound: ['31', '0'], name: trace_rv_i_tval_ip}

  - {name: iccm_ecc_single_error}
  - {name: iccm_ecc_double_error}
  - {name: dccm_ecc_single_error}
  - {name: dccm_ecc_double_error}

  - {name: dec_tlu_perfcnt0}
  - {name: dec_tlu_perfcnt1}
  - {name: dec_tlu_perfcnt2}
  - {name: dec_tlu_perfcnt3}

  - {name: jtag_tdo}
  - {name: jtag_tdoEn}

  - {name: mpc_debug_halt_ack}
  - {name: mpc_debug_run_ack}
  - {name: debug_brkpt_status}

  - {name: o_cpu_halt_ack}
  - {name: o_cpu_halt_status}
  - {name: o_debug_mode_status}
  - {name: o_cpu_run_ack}

  - {name: dmi_uncore_en}
  - {name: dmi_uncore_wr_en}
  - {bound: ['6', '0'], name: dmi_uncore_addr}
  - {bound: ['31', '0'], name: dmi_uncore_wdata}
  - {name: dmi_active}

